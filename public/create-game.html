<!DOCTYPE html>

<html>
  <head>
    <script src="/public/htmx.min.js"></script>
    <meta charset="UTF-8" />

    <style>
      .row {
        padding: 5px 0px;
      }
    </style>
  </head>

  <body>
    <form name="game-setup" hx-post="/api/new-game" hx-swap="none">
      <div class="row">
        <label for="type-x">Player X Type:</label>
        <select id="type-x" name="typeX" required>
          <option value="human">Human</option>
          <option value="easyComputer">Easy Computer</option>
          <option value="mediumComputer">Medium Computer</option>
          <option value="hardComputer">Hard Computer</option>
        </select>
      </div>
      <div class="row">
        <label for="type-o">Player O Type:</label>
        <select id="type-o" name="typeO" required>
          <option value="human">Human</option>
          <option value="easyComputer">Easy Computer</option>
          <option value="mediumComputer">Medium Computer</option>
          <option value="hardComputer">Hard Computer</option>
        </select>
      </div>
      <div class="row">
        <button type="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
